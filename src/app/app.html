<main class="app-container">
  <span>liked {{likedRecipes().size}}</span>
  <section class="search-section">
    <input #searchInput id="search-query" class="search-input" type="text" placeholder="Search recipes..."
      (input)="onSearch($event)" aria-label="Search recipes" (keyup.escape)="clearSearch()" />
    <button *ngIf="searchInput.value.length > 0" class="clear-button" (click)="clearSearch()"
      aria-label="Clear search">✖</button>
  </section>
  <section class="card-wrapper">
    <!-- Control flow syntax. Tracking by recipe.id for better performance. -->
    @for (recipe of recipes(); track trackRecipe(index, recipe); let index = $index) {
    <app-recipe-card [isLoading]="isLoading()" [recipe]="recipe" [index]="index + 1"
      [liked]="likedRecipes().has(recipe.id)" (likedChange)="onRecipeLiked($event)"
      (recipeSelected)="onRecipeSelected($event)">
      <div class="recipe-card-placeholder" #cardLoader cardLoader>
        <div class="recipe-card-skeleton">
          <div class="skeleton-image"></div>

          <div class="skeleton-content">
            <div class="skeleton-title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
          </div>
        </div>
      </div>
      <img class="recipe-card__img" src="no-image.jpg" />
    </app-recipe-card>
    }

    @if (!isLoading() && recipes().length === 0) {
    <h1>No recipes available</h1>
    }
  </section>
  <div class="pagination">
    <!-- oldsyntax uses *ngFor directive from CommonModule -->
    <button *ngFor="let i of pages()" [class.active]="currentPage === i" (click)="loadRecipes(i)">
      {{ i }}
    </button>
  </div>
</main>
